#!name = All In One Pro Max Ultimate - Safe Strict
#!desc = Shadowrocket iPhone | Wi-Fi + 4G/5G | Strict DNS/domain ad blocking
#!author = Custom

[General]
bypass-system = true
ipv6 = false
dns-server = system
skip-proxy = 127.0.0.1, localhost, *.local
udp-policy-not-supported-behaviour = DIRECT

[Rule]
# Local network and private IP ranges
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# Strict ad / tracking domain blocking (may affect some app analytics)
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googlesyndication.com,REJECT
DOMAIN-SUFFIX,googleadservices.com,REJECT
DOMAIN-SUFFIX,adservice.google.com,REJECT
DOMAIN-SUFFIX,adnxs.com,REJECT
DOMAIN-SUFFIX,adsrvr.org,REJECT
DOMAIN-SUFFIX,adform.net,REJECT
DOMAIN-SUFFIX,app-measurement.com,REJECT
DOMAIN-SUFFIX,adjust.com,REJECT
DOMAIN-SUFFIX,branch.io,REJECT
DOMAIN-SUFFIX,unity3d.com,REJECT
DOMAIN-SUFFIX,applovin.com,REJECT
DOMAIN-SUFFIX,ironsrc.com,REJECT

# App services: route through the selected proxy policy
DOMAIN-SUFFIX,youtube.com,PROXY
DOMAIN-SUFFIX,youtubei.googleapis.com,PROXY
DOMAIN-SUFFIX,googlevideo.com,PROXY
DOMAIN-SUFFIX,ytimg.com,PROXY
DOMAIN-SUFFIX,spotify.com,PROXY
DOMAIN-SUFFIX,scdn.co,PROXY
DOMAIN-SUFFIX,spotifycdn.com,PROXY
DOMAIN-SUFFIX,soundcloud.com,PROXY
DOMAIN-SUFFIX,sndcdn.com,PROXY
DOMAIN-SUFFIX,api.revenuecat.com,PROXY

# Default routing
GEOIP,VN,DIRECT
FINAL,PROXY

[URL Rewrite]
# No HTTPS content rewriting enabled in the baseline config

[MITM]
# Intentionally empty: do not decrypt HTTPS by default
